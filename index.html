<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BabyTracker</title>

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" sizes="512x512" href="./icon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BabyTracker">
    <link rel="apple-touch-icon" href="./icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-baby text-yellow-500 mr-2"></i>BabyTracker</h1>
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <div id="viewRegistro" class="tab-content active space-y-6">
            <div id="timerCard" class="bg-green-50 border-2 border-green-200 rounded-2xl p-4 flex justify-between items-center transition-colors duration-500">
                <div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Tiempo Transcurrido</p>
                    <p class="text-3xl font-black text-gray-800" id="tiempoTranscurrido">-- min</p>
                </div>
                <div class="text-right">
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Límite</p>
                    <p class="text-lg font-bold text-gray-700"><span id="limiteDisplay">150</span> min</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Cantidad (Onzas - OZ)</label>
                    <div class="flex items-center space-x-4 bg-gray-50 rounded-xl p-2 border border-gray-200">
                        <button type="button" id="btnMinus" class="w-10 h-10 bg-white rounded-lg shadow-sm text-gray-600 font-bold text-xl flex-shrink-0">-</button>
                        <input type="number" id="inputOz" value="4.0" step="0.5" class="w-full min-w-0 bg-transparent text-center text-4xl font-black text-blue-600 focus:outline-none">
                        <button type="button" id="btnPlus" class="w-10 h-10 bg-white rounded-lg shadow-sm text-gray-600 font-bold text-xl flex-shrink-0">+</button>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Hora de la toma</label>
                    <input type="datetime-local" id="inputHora" class="w-full bg-gray-50 border border-gray-200 text-gray-700 font-bold rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button id="btnGuardar" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold text-lg rounded-xl py-4 shadow-md transition-all">
                    Guardar Toma
                </button>
            </div>
        </div>

        <div id="viewHistorial" class="tab-content">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Historial de Tomas</h2>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <ul id="listaHistorial" class="divide-y divide-gray-100">
                    <li class="p-6 text-center text-gray-500">Cargando historial...</li>
                </ul>
            </div>
        </div>

        <div id="viewReportes" class="tab-content">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Reporte de Consumo (7 días)</h2>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                <canvas id="graficoOnzas"></canvas>
            </div>
        </div>

    </main>

    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full z-20 pb-safe">
        <div class="max-w-md mx-auto flex justify-between items-center p-2">
            <button onclick="cambiarTab('viewRegistro', this)" class="nav-btn active flex-1 py-2 text-blue-600 flex flex-col items-center">
                <i class="fa-solid fa-bottle-droplet text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Registro</span>
            </button>
            <button onclick="cambiarTab('viewHistorial', this)" class="nav-btn flex-1 py-2 text-gray-400 hover:text-blue-500 transition-colors flex flex-col items-center">
                <i class="fa-solid fa-clipboard-list text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Historial</span>
            </button>
            <button onclick="cambiarTab('viewReportes', this)" class="nav-btn flex-1 py-2 text-gray-400 hover:text-blue-500 transition-colors flex flex-col items-center">
                <i class="fa-solid fa-chart-bar text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Reportes</span>
            </button>
            <button onclick="abrirSettings()" class="flex-1 py-2 text-gray-400 hover:text-gray-600 transition-colors flex flex-col items-center">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-bold">Ajustes</span>
            </button>
        </div>
    </nav>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl">
            <h2 class="text-xl font-bold mb-4">Configuración</h2>
            <label class="block text-sm font-bold text-gray-600 mb-2">Minutos límite para próxima toma:</label>
            <input type="number" id="inputLimite" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-6 text-xl text-center font-bold">
            <div class="flex space-x-3">
                <button onclick="cerrarSettings()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl">Cancelar</button>
                <button id="btnGuardarSettings" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CREDENCIALES FIREBASE ---
        // ¡REEMPLAZA ESTO CON TUS DATOS REALES!
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- 2. VARIABLES Y ESTADOS ---
        let limiteMinutos = 150; 
        let ultimaToma = new Date();
        let intervaloReloj;
        let graficoInstancia = null;

        // Banderas para el motor de notificaciones (Alarmas)
        let notificado10Min = false;
        let notificadoLimite = false;
        let ultimaTomaId = null; // Para detectar registros nuevos

        // Referencias DOM principales
        const inputOz = document.getElementById('inputOz');
        const inputHora = document.getElementById('inputHora');
        const btnGuardar = document.getElementById('btnGuardar');
        const tiempoTranscurrido = document.getElementById('tiempoTranscurrido');
        const timerCard = document.getElementById('timerCard');
        const limiteDisplay = document.getElementById('limiteDisplay');
        const listaHistorial = document.getElementById('listaHistorial');

        // Solicitar permiso para notificaciones al cargar
        if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        // Configurar hora inicial por defecto
        function setHoraActual() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            inputHora.value = now.toISOString().slice(0, 16);
        }
        setHoraActual();

        // Controles de botones de cantidad (+ / -)
        document.getElementById('btnMinus').addEventListener('click', () => {
            let val = parseFloat(inputOz.value);
            if(val > 0.5) inputOz.value = (val - 0.5).toFixed(1);
        });
        document.getElementById('btnPlus').addEventListener('click', () => {
            let val = parseFloat(inputOz.value);
            inputOz.value = (val + 0.5).toFixed(1);
        });

        // --- 3. NAVEGACIÓN (TABS) ---
        function cambiarTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-600');
                btn.classList.add('text-gray-400');
            });
            btnElement.classList.remove('text-gray-400');
            btnElement.classList.add('text-blue-600');
        }

        // --- 4. FUNCIÓN AUXILIAR: ENVIAR NOTIFICACIÓN (ALARMA) ---
        function enviarNotificacion(titulo, cuerpo) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(titulo, {
                    body: cuerpo,
                    icon: "./icon.png" // Usa tu icono personalizado
                });
            }
        }

        // --- 5. FIREBASE: CONFIGURACIÓN GLOBAL SINCRONIZADA ---
        db.collection("configuracion").doc("limiteGlobal").onSnapshot((doc) => {
            if (doc.exists) {
                limiteMinutos = doc.data().minutos;
                limiteDisplay.innerText = limiteMinutos;
                document.getElementById('inputLimite').value = limiteMinutos;
                actualizarColorReloj(); 
            } else {
                db.collection("configuracion").doc("limiteGlobal").set({ minutos: 150 });
            }
        });

        // --- 6. FIREBASE: LECTURA EN TIEMPO REAL (HISTORIAL, RELOJ, GRÁFICOS Y ALARMAS) ---
        db.collection("tomas").orderBy("fecha", "desc").onSnapshot((snapshot) => {
            listaHistorial.innerHTML = "";
            let tomasParaGrafico = [];

            if (snapshot.empty) {
                listaHistorial.innerHTML = "<li class='p-6 text-center text-gray-500'>No hay tomas registradas</li>";
                tiempoTranscurrido.innerText = "Sin tomas";
                return;
            }

            // Lógica inteligente para resetear las alarmas ante un nuevo registro
            const primerDoc = snapshot.docs[0];
            const nuevaUltimaToma = primerDoc.data().fecha.toDate();

            if (ultimaTomaId !== primerDoc.id) {
                ultimaTomaId = primerDoc.id; 
                ultimaToma = nuevaUltimaToma;
                // Reseteamos las banderas de notificaciones
                notificado10Min = false; 
                notificadoLimite = false; 
                iniciarReloj();
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const fechaToma = data.fecha.toDate();
                const horaStr = fechaToma.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                tomasParaGrafico.push(data);

                // Renderizar lista del historial con botón de borrar
                const li = document.createElement('li');
                li.className = "p-4 flex justify-between items-center hover:bg-gray-50 transition-colors";
                li.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="bg-blue-100 p-3 rounded-full text-blue-600">
                            <i class="fa-solid fa-bottle-droplet"></i>
                        </div>
                        <div>
                            <p class="font-bold text-gray-800">${horaStr}</p>
                            <p class="text-xs text-gray-500 uppercase tracking-wider">${fechaToma.toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="text-right">
                            <p class="text-xl font-black text-blue-600">${data.onzas} <span class="text-sm font-bold text-gray-400">oz</span></p>
                        </div>
                        <button onclick="borrarToma('${id}', '${horaStr}')" class="text-red-400 hover:text-red-600 p-2 transition-colors">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listaHistorial.appendChild(li);
            });

            generarGrafico(tomasParaGrafico);
        });

        // --- 7. FIREBASE: GUARDAR NUEVA TOMA CON MANEJO DE ERRORES ---
        btnGuardar.addEventListener('click', () => {
            btnGuardar.innerText = "Guardando...";
            btnGuardar.disabled = true;
            btnGuardar.classList.add('opacity-75');

            const fechaToma = new Date(inputHora.value);
            const onzas = parseFloat(inputOz.value);

            db.collection("tomas").add({
                fecha: fechaToma,
                onzas: onzas,
                registro: new Date() // Fecha de creación real
            })
            .then(() => {
                // Éxito visual
                btnGuardar.innerText = "¡Guardado!";
                btnGuardar.classList.remove('bg-blue-600');
                btnGuardar.classList.add('bg-green-500');
                
                setTimeout(() => {
                    btnGuardar.innerText = "Guardar Toma";
                    btnGuardar.classList.remove('bg-green-500');
                    btnGuardar.classList.add('bg-blue-600');
                    btnGuardar.disabled = false;
                    btnGuardar.classList.remove('opacity-75');
                    setHoraActual(); // Resetear a la hora actual
                }, 2000);
            })
            .catch((error) => {
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar en la base de datos. Revisa las reglas de Firestore.");
                btnGuardar.innerText = "Guardar Toma";
                btnGuardar.disabled = false;
                btnGuardar.classList.remove('opacity-75');
            });
        });

        // --- 8. LÓGICA DEL RELOJ Y MOTOR DE ALARMAS ---
        function iniciarReloj() {
            if (intervaloReloj) clearInterval(intervaloReloj);
            actualizarReloj();
            intervaloReloj = setInterval(actualizarReloj, 60000); // Actualizar cada minuto
        }

        function actualizarReloj() {
            const ahora = new Date();
            const diffMs = ahora - ultimaToma;
            const diffMinutos = Math.floor(diffMs / 60000);
            
            if(diffMinutos < 0) {
                tiempoTranscurrido.innerText = "Toma futura";
                return;
            }

            tiempoTranscurrido.innerText = `${diffMinutos} min`;
            actualizarColorReloj(diffMinutos);

            // --- MOTOR DE NOTIFICACIONES (ALARMAS) ---
            const minutosRestantes = limiteMinutos - diffMinutos;

            // Alarma 1: Faltan 10 minutos exactos
            if (minutosRestantes === 10 && !notificado10Min) {
                enviarNotificacion("¡Atención! 🍼", "Faltan 10 minutos para el límite de la próxima toma.");
                notificado10Min = true; // Evitar spam el siguiente minuto
            } 
            // Alarma 2: Se excedió el tiempo límite
            else if (minutosRestantes <= 0 && !notificadoLimite) {
                enviarNotificacion("¡Hora del biberón! 🚨", "Se ha alcanzado o excedido el tiempo límite configurado.");
                notificadoLimite = true; 
            }
        }

        // Lógica visual de colores del reloj
        function actualizarColorReloj(minutos = null) {
            if(minutos === null) {
                const diffMs = new Date() - ultimaToma;
                minutos = Math.floor(diffMs / 60000);
            }
            const porcentaje = minutos / limiteMinutos;
            
            timerCard.classList.remove('bg-green-50', 'border-green-200', 'bg-orange-50', 'border-orange-200', 'bg-red-50', 'border-red-300', 'animate-pulse');
            
            if (porcentaje < 0.6) {
                timerCard.classList.add('bg-green-50', 'border-green-200'); // Verde
            } else if (porcentaje < 0.9) {
                timerCard.classList.add('bg-orange-50', 'border-orange-200'); // Naranja
            } else {
                timerCard.classList.add('bg-red-50', 'border-red-300', 'animate-pulse'); // Rojo
            }
        }

        // --- 9. GRÁFICOS (CHART.JS) ---
        function generarGrafico(tomas) {
            const ctx = document.getElementById('graficoOnzas').getContext('2d');
            
            // Agrupar onzas por fecha
            const resumen = {};
            tomas.forEach(toma => {
                const fechaStr = toma.fecha.toDate().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                resumen[fechaStr] = (resumen[fechaStr] || 0) + toma.onzas;
            });

            // Ordenar fechas cronológicamente
            const etiquetas = Object.keys(resumen).reverse().slice(-7); // Últimos 7 días activos
            const datos = etiquetas.map(fecha => resumen[fecha]);

            if(graficoInstancia) {
                graficoInstancia.destroy(); // Evitar superposición de gráficos
            }

            graficoInstancia = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [{
                        label: 'Onzas Consumidas',
                        data: datos,
                        backgroundColor: '#3b82f6', // Azul Tailwind
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Onzas (oz)' } }
                    }
                }
            });
        }

        // --- 10. FUNCIÓN: BORRAR TOMA DEL HISTORIAL ---
        function borrarToma(id, horaStr) {
            if(confirm(`¿Estás seguro de que deseas borrar la toma de las ${horaStr}?`)) {
                db.collection("tomas").doc(id).delete()
                .then(() => console.log("Toma borrada exitosamente"))
                .catch((error) => alert("Error al borrar: " + error.message));
            }
        }

        // --- 11. MODAL DE AJUSTES SINCRONIZADO ---
        const modal = document.getElementById('settingsModal');
        function abrirSettings() { modal.classList.remove('hidden'); }
        function cerrarSettings() { modal.classList.add('hidden'); }
        
        document.getElementById('btnGuardarSettings').addEventListener('click', () => {
            const nuevoLimite = parseInt(document.getElementById('inputLimite').value);
            if(nuevoLimite > 0) {
                // Guardar en Firebase para que se sincronice en ambos teléfonos
                db.collection("configuracion").doc("limiteGlobal").set({ minutos: nuevoLimite })
                .then(() => cerrarSettings())
                .catch(err => alert("Error al guardar configuración: " + err.message));
            }
        });
    </script>
</body>
</html>
