<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BabyTracker</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BabyTracker">
    <link rel="icon" sizes="512x512" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:    #FFF8F0;
            --peach:    #FCDAB7;
            --apricot:  #F4A261;
            --coral:    #E76F51;
            --sage:     #81B29A;
            --sage-lt:  #C8DDD4;
            --sky:      #457B9D;
            --sky-lt:   #BDD5E8;
            --lavender: #C9B8D8;
            --ink:      #2D2214;
            --muted:    #9A8878;
            --warn:     #E9C46A;
            --danger:   #E63946;
            --card-bg:  rgba(255,255,255,0.78);
            --glass:    rgba(255,255,255,0.55);
            --radius:   20px;
            --radius-sm:12px;
            --shadow:   0 4px 24px rgba(45,34,20,0.10);
            --shadow-lg:0 8px 40px rgba(45,34,20,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background: var(--cream);
            color: var(--ink);
        }

        /* ── Background blob decoration ── */
        body::before {
            content: '';
            position: fixed;
            top: -120px; right: -120px;
            width: 380px; height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--peach) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -100px; left: -80px;
            width: 320px; height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--sage-lt) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── LAYOUT ── */
        #app {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 430px;
            margin: 0 auto;
        }

        /* ── HEADER ── */
        header {
            padding: 16px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--apricot), var(--coral));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 10px rgba(244,162,97,0.45);
        }
        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--ink);
            letter-spacing: -0.3px;
        }
        .header-title span { color: var(--apricot); }
        .settings-btn {
            width: 38px; height: 38px;
            border: none;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid rgba(255,255,255,0.8);
            transition: all .2s;
        }
        .settings-btn:active { transform: scale(0.92); background: var(--peach); }

        /* ── SCROLLABLE CONTENT ── */
        #scroll-area {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 8px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: none;
        }
        #scroll-area::-webkit-scrollbar { display: none; }

        /* ── CARDS ── */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: var(--radius);
            border: 1.5px solid rgba(255,255,255,0.9);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* ── TIMER CARD ── */
        #timerCard {
            padding: 20px;
            transition: background .6s, border-color .6s;
            background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(252,218,183,0.45));
        }
        #timerCard.state-warn {
            background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(233,196,106,0.45));
        }
        #timerCard.state-danger {
            background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(230,57,70,0.15));
            animation: pulse-border 1.4s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%, 100% { box-shadow: var(--shadow); }
            50%       { box-shadow: 0 0 0 4px rgba(230,57,70,0.18), var(--shadow); }
        }

        .timer-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .timer-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }
        #tiempoTranscurrido {
            font-size: 38px;
            font-weight: 900;
            line-height: 1;
            color: var(--ink);
            letter-spacing: -1px;
            transition: color .4s;
        }
        #timerCard.state-warn  #tiempoTranscurrido { color: #B07C00; }
        #timerCard.state-danger #tiempoTranscurrido { color: var(--danger); }

        .timer-meta {
            text-align: right;
        }
        .timer-meta-val {
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
        }
        .timer-meta-val span { font-size: 12px; font-weight: 700; color: var(--muted); }

        /* Progress track */
        .progress-track {
            height: 8px;
            background: rgba(45,34,20,0.08);
            border-radius: 99px;
            overflow: hidden;
        }
        #progressBar {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--sage), var(--sky));
            width: 0%;
            transition: width 1s linear, background .6s;
        }
        #timerCard.state-warn  #progressBar { background: linear-gradient(90deg, var(--warn), #D4A017); }
        #timerCard.state-danger #progressBar { background: linear-gradient(90deg, var(--coral), var(--danger)); }

        /* Last feed pill */
        #lastFeedPill {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #lastFeedPill .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--sage);
            display: inline-block;
        }

        /* ── REGISTER CARD ── */
        .reg-card { padding: 20px; }

        .reg-header {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
        }

        /* Oz stepper */
        .oz-stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--cream);
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--peach);
            padding: 10px 14px;
            margin-bottom: 14px;
        }
        .step-btn {
            width: 40px; height: 40px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(45,34,20,0.10);
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s, box-shadow .15s;
            flex-shrink: 0;
        }
        .step-btn:active { transform: scale(0.88); box-shadow: none; }

        .oz-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #inputOzDisplay {
            font-size: 44px;
            font-weight: 900;
            color: var(--sky);
            line-height: 1;
            letter-spacing: -2px;
        }
        .oz-unit {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        /* Hidden real input */
        #inputOz { display: none; }

        /* Quick-select pills */
        .quick-pills {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .quick-pill {
            border: none;
            background: var(--peach);
            color: var(--ink);
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            font-weight: 800;
            border-radius: 99px;
            padding: 5px 14px;
            cursor: pointer;
            transition: all .15s;
        }
        .quick-pill:active,
        .quick-pill.active {
            background: var(--apricot);
            color: #fff;
        }

        /* Time row */
        .time-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .time-label-box {
            display: flex;
            flex-direction: column;
        }
        .time-label-box .tl-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
        }
        .time-input-wrap {
            flex: 1;
            position: relative;
        }
        #inputHora {
            width: 100%;
            background: var(--cream);
            border: 1.5px solid var(--peach);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            outline: none;
            transition: border-color .2s;
        }
        #inputHora:focus { border-color: var(--apricot); }
        .now-btn {
            border: none;
            background: var(--sage-lt);
            color: var(--sage);
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
        }
        .now-btn:active { background: var(--sage); color: #fff; }

        /* Save button */
        #btnGuardar {
            width: 100%;
            background: linear-gradient(135deg, var(--apricot), var(--coral));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(231,111,81,0.40);
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #btnGuardar:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(231,111,81,0.30); }
        #btnGuardar:disabled { opacity: .7; }
        #btnGuardar.saved {
            background: linear-gradient(135deg, var(--sage), #5A9E84);
            box-shadow: 0 4px 18px rgba(129,178,154,0.40);
        }

        /* ── HISTORY CARD ── */
        .section-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 16px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-badge {
            background: var(--peach);
            color: var(--apricot);
            font-size: 10px;
            font-weight: 900;
            padding: 2px 9px;
            border-radius: 99px;
        }

        #listaHistorial {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #listaHistorial::-webkit-scrollbar { display: none; }

        .hist-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 12px;
            border-bottom: 1px solid rgba(45,34,20,0.05);
            animation: slideIn .25s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .hist-item:last-child { border-bottom: none; }
        .hist-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .hist-icon.color-a { background: var(--sky-lt); color: var(--sky); }
        .hist-icon.color-b { background: var(--sage-lt); color: var(--sage); }
        .hist-icon.color-c { background: var(--peach); color: var(--apricot); }
        .hist-meta { flex: 1; min-width: 0; }
        .hist-time { font-size: 14px; font-weight: 800; color: var(--ink); }
        .hist-date { font-size: 11px; color: var(--muted); font-weight: 600; }
        .hist-oz {
            font-size: 18px; font-weight: 900;
            color: var(--sky);
            white-space: nowrap;
        }
        .hist-oz span { font-size: 11px; font-weight: 700; color: var(--muted); }
        .hist-del {
            border: none; background: none;
            color: #ddd;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: all .15s;
        }
        .hist-del:active { color: var(--danger); background: rgba(230,57,70,0.08); }

        .hist-empty {
            padding: 28px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        /* ── CHART CARD ── */
        .chart-card { padding: 16px 16px 12px; }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .chart-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
        }
        .filter-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .filter-date {
            background: var(--cream);
            border: 1.5px solid var(--peach);
            border-radius: 8px;
            padding: 5px 8px;
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
            outline: none;
            width: 108px;
        }
        .filter-btn {
            border: none;
            background: var(--apricot);
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all .15s;
        }
        .filter-btn:active { background: var(--coral); }

        #graficoOnzasCurva {
            max-height: 160px;
        }

        /* ── SETTINGS MODAL ── */
        #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45,34,20,0.45);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
        }
        #settingsModal.open { display: flex; }
        .modal-sheet {
            background: #fff;
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 430px;
            padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
            animation: sheetUp .3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes sheetUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-drag {
            width: 40px; height: 4px;
            border-radius: 2px;
            background: #e0e0e0;
            margin: 0 auto 20px;
        }
        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--ink);
            margin-bottom: 18px;
        }
        .modal-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            display: block;
        }
        #inputLimite {
            width: 100%;
            background: var(--cream);
            border: 1.5px solid var(--peach);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 28px;
            font-weight: 900;
            text-align: center;
            color: var(--ink);
            outline: none;
            margin-bottom: 20px;
            transition: border-color .2s;
        }
        #inputLimite:focus { border-color: var(--apricot); }
        .modal-btns {
            display: flex;
            gap: 10px;
        }
        .modal-cancel {
            flex: 1;
            border: none;
            background: #F2EDE8;
            color: var(--muted);
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 800;
            padding: 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .modal-save {
            flex: 1;
            border: none;
            background: linear-gradient(135deg, var(--apricot), var(--coral));
            color: #fff;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 900;
            padding: 13px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(231,111,81,0.35);
        }

        /* ── TOAST ── */
        #toast {
            position: fixed;
            bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--ink);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 99px;
            z-index: 200;
            transition: transform .35s cubic-bezier(0.34,1.56,0.64,1), opacity .3s;
            opacity: 0;
            white-space: nowrap;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
<div id="app">

    <!-- HEADER -->
    <header>
        <div class="header-brand">
            <div class="header-icon">🍼</div>
            <div class="header-title">Baby<span>Tracker</span></div>
        </div>
        <button class="settings-btn" onclick="abrirSettings()" title="Ajustes">⚙️</button>
    </header>

    <!-- SCROLL AREA -->
    <div id="scroll-area">

        <!-- 1. TIMER CARD -->
        <div id="timerCard" class="card">
            <div class="timer-top">
                <div>
                    <div class="timer-label" id="labelReloj">Siguiente toma en</div>
                    <div id="tiempoTranscurrido">-- min</div>
                </div>
                <div class="timer-meta">
                    <div class="timer-label">Meta</div>
                    <div class="timer-meta-val"><span id="limiteDisplay">150</span> <span>min</span></div>
                </div>
            </div>
            <div class="progress-track">
                <div id="progressBar"></div>
            </div>
            <div id="lastFeedPill">
                <span class="dot"></span>
                <span id="lastFeedText">Cargando última toma…</span>
            </div>
        </div>

        <!-- 2. REGISTER CARD -->
        <div class="card reg-card">
            <div class="reg-header">Registrar toma</div>

            <!-- Oz stepper -->
            <div class="oz-stepper">
                <button class="step-btn" id="btnMinus">−</button>
                <div class="oz-display">
                    <div id="inputOzDisplay">4.0</div>
                    <div class="oz-unit">Onzas (oz)</div>
                </div>
                <button class="step-btn" id="btnPlus">+</button>
            </div>
            <input type="number" id="inputOz" value="4.0" step="0.5">

            <!-- Quick pills -->
            <div class="quick-pills" id="quickPills">
                <button class="quick-pill" data-oz="2.0">2 oz</button>
                <button class="quick-pill" data-oz="3.0">3 oz</button>
                <button class="quick-pill active" data-oz="4.0">4 oz</button>
                <button class="quick-pill" data-oz="5.0">5 oz</button>
                <button class="quick-pill" data-oz="6.0">6 oz</button>
            </div>

            <!-- Time row -->
            <div class="time-row">
                <div class="time-input-wrap">
                    <input type="datetime-local" id="inputHora">
                </div>
                <button class="now-btn" id="btnAhora">Ahora</button>
            </div>

            <!-- Save -->
            <button id="btnGuardar">
                <span id="btnGuardarIcon">🍼</span>
                <span id="btnGuardarLabel">Guardar toma</span>
            </button>
        </div>

        <!-- 3. HISTORY CARD -->
        <div class="card" style="overflow:hidden">
            <div class="section-label">
                <span>Historial reciente</span>
                <span class="section-badge" id="histBadge">—</span>
            </div>
            <ul id="listaHistorial">
                <li class="hist-empty">Cargando historial…</li>
            </ul>
        </div>

        <!-- 4. CHART CARD -->
        <div class="card chart-card">
            <div class="chart-header">
                <div class="chart-title">Consumo acumulado</div>
            </div>
            <div class="filter-row" style="margin-bottom:12px">
                <input type="date" class="filter-date" id="dateFilterStart">
                <input type="date" class="filter-date" id="dateFilterEnd">
                <button class="filter-btn" id="btnAplicarFiltros">↻</button>
            </div>
            <canvas id="graficoOnzasCurva"></canvas>
        </div>

    </div><!-- /scroll-area -->
</div><!-- /app -->

<!-- SETTINGS MODAL (bottom sheet) -->
<div id="settingsModal">
    <div class="modal-sheet">
        <div class="modal-drag"></div>
        <div class="modal-title">Configuración ⚙️</div>
        <label class="modal-label" for="inputLimite">Minutos límite entre tomas</label>
        <input type="number" id="inputLimite" value="150">
        <div class="modal-btns">
            <button class="modal-cancel" onclick="cerrarSettings()">Cancelar</button>
            <button class="modal-save" id="btnGuardarSettings">Guardar</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
    /* ── FIREBASE CONFIG ── */
    const firebaseConfig = {
        apiKey: "AIzaSyC1p8czf56NeSUboDYSzaSed4m2yJq2SDA",
        authDomain: "momb2b-3eb14.firebaseapp.com",
        projectId: "momb2b-3eb14",
        storageBucket: "momb2b-3eb14.firebasestorage.app",
        messagingSenderId: "440475320328",
        appId: "1:440475320328:web:794638a982f19902a891bd",
        measurementId: "G-JXCTRXV4ZF"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /* ── STATE ── */
    let limiteMinutos   = 150;
    let ultimaToma      = new Date();
    let intervaloReloj  = null;
    let graficoInstancia= null;
    let tomasProcesadas = [];
    let notificado10Min = false;
    let notificadoLimite= false;
    let ultimaTomaId    = null;

    /* ── DOM REFS ── */
    const inputOz          = document.getElementById('inputOz');
    const inputOzDisplay   = document.getElementById('inputOzDisplay');
    const inputHora        = document.getElementById('inputHora');
    const btnGuardar       = document.getElementById('btnGuardar');
    const btnGuardarLabel  = document.getElementById('btnGuardarLabel');
    const btnGuardarIcon   = document.getElementById('btnGuardarIcon');
    const tiempoEl         = document.getElementById('tiempoTranscurrido');
    const timerCard        = document.getElementById('timerCard');
    const limiteDisplay    = document.getElementById('limiteDisplay');
    const listaHistorial   = document.getElementById('listaHistorial');
    const lastFeedText     = document.getElementById('lastFeedText');
    const labelReloj       = document.getElementById('labelReloj');
    const filterStart      = document.getElementById('dateFilterStart');
    const filterEnd        = document.getElementById('dateFilterEnd');
    const histBadge        = document.getElementById('histBadge');

    /* ── HELPERS ── */
    function toast(msg, duration = 2200) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    function setHoraActual() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        inputHora.value = now.toISOString().slice(0, 16);
    }
    setHoraActual();

    function syncOzDisplay(val) {
        inputOzDisplay.textContent = parseFloat(val).toFixed(1);
        // highlight matching pill
        document.querySelectorAll('.quick-pill').forEach(p => {
            p.classList.toggle('active', parseFloat(p.dataset.oz) === parseFloat(val));
        });
    }

    /* ── OZ CONTROLS ── */
    document.getElementById('btnMinus').addEventListener('click', () => {
        let v = parseFloat(inputOz.value);
        if (v > 0.5) { inputOz.value = (v - 0.5).toFixed(1); syncOzDisplay(inputOz.value); }
    });
    document.getElementById('btnPlus').addEventListener('click', () => {
        let v = parseFloat(inputOz.value);
        inputOz.value = (v + 0.5).toFixed(1);
        syncOzDisplay(inputOz.value);
    });

    document.getElementById('quickPills').addEventListener('click', e => {
        const btn = e.target.closest('.quick-pill');
        if (!btn) return;
        inputOz.value = btn.dataset.oz;
        syncOzDisplay(inputOz.value);
    });

    document.getElementById('btnAhora').addEventListener('click', () => {
        setHoraActual();
        toast('⏰ Hora actualizada');
    });

    /* ── NOTIFICATIONS ── */
    if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }
    function enviarNotificacion(titulo, cuerpo) {
        if ("Notification" in window && Notification.permission === "granted") {
            new Notification(titulo, { body: cuerpo, icon: "./icon.png" });
        }
    }

    /* ── FIREBASE: CONFIG SYNC ── */
    db.collection("configuracion").doc("limiteGlobal").onSnapshot((doc) => {
        if (doc.exists) {
            limiteMinutos = doc.data().minutos;
            limiteDisplay.textContent = limiteMinutos;
            document.getElementById('inputLimite').value = limiteMinutos;
        } else {
            db.collection("configuracion").doc("limiteGlobal").set({ minutos: 150 });
        }
    });

    /* ── FIREBASE: TOMAS REALTIME ── */
    db.collection("tomas").orderBy("fecha", "desc").onSnapshot((snapshot) => {
        listaHistorial.innerHTML = "";
        tomasProcesadas = [];

        if (snapshot.empty) {
            listaHistorial.innerHTML = "<li class='hist-empty'>No hay tomas registradas aún 🍼</li>";
            tiempoEl.textContent = "Sin tomas";
            histBadge.textContent = "0";
            return;
        }

        const primerDoc  = snapshot.docs[0];
        const nuevaUltimaToma = primerDoc.data().fecha.toDate();
        if (ultimaTomaId !== primerDoc.id) {
            ultimaTomaId   = primerDoc.id;
            ultimaToma     = nuevaUltimaToma;
            notificado10Min= false;
            notificadoLimite = false;
            iniciarReloj();
        }

        const colorClasses = ['color-a', 'color-b', 'color-c'];

        snapshot.forEach((doc, i) => {
            const data     = doc.data();
            const id       = doc.id;
            const fechaToma= data.fecha.toDate();
            const horaStr  = fechaToma.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const fechaStr = fechaToma.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
            tomasProcesadas.push({ id, fecha: fechaToma, onzas: data.onzas });

            const li = document.createElement('li');
            li.className = 'hist-item';
            li.innerHTML = `
                <div class="hist-icon ${colorClasses[i % 3]}">🍼</div>
                <div class="hist-meta">
                    <div class="hist-time">${horaStr}</div>
                    <div class="hist-date">${fechaStr}</div>
                </div>
                <div class="hist-oz">${data.onzas} <span>oz</span></div>
                <button class="hist-del" onclick="borrarToma('${id}','${horaStr}')" title="Eliminar">🗑</button>
            `;
            listaHistorial.appendChild(li);
        });

        histBadge.textContent = snapshot.size;
        generarGrafico();
    });

    /* ── SAVE TOMA ── */
    btnGuardar.addEventListener('click', () => {
        btnGuardarLabel.textContent = "Guardando…";
        btnGuardarIcon.textContent  = "⏳";
        btnGuardar.disabled = true;

        const fechaToma = new Date(inputHora.value);
        const onzas     = parseFloat(inputOz.value);

        db.collection("tomas").add({ fecha: fechaToma, onzas, registro: new Date() })
        .then(() => {
            btnGuardar.classList.add('saved');
            btnGuardarLabel.textContent = "¡Toma guardada!";
            btnGuardarIcon.textContent  = "✅";
            toast('✅ Toma registrada correctamente');
            setTimeout(() => {
                btnGuardar.classList.remove('saved');
                btnGuardarLabel.textContent = "Guardar toma";
                btnGuardarIcon.textContent  = "🍼";
                btnGuardar.disabled = false;
                setHoraActual();
            }, 2200);
        })
        .catch(err => {
            toast('❌ Error al guardar: ' + err.message, 3500);
            btnGuardarLabel.textContent = "Guardar toma";
            btnGuardarIcon.textContent  = "🍼";
            btnGuardar.disabled = false;
        });
    });

    /* ── CLOCK ── */
    function iniciarReloj() {
        if (intervaloReloj) clearInterval(intervaloReloj);
        actualizarReloj();
        intervaloReloj = setInterval(actualizarReloj, 30000);
    }

    function actualizarReloj() {
        const ahora       = new Date();
        const diffMs      = ahora - ultimaToma;
        const diffMinutos = Math.floor(diffMs / 60000);
        let minutosRestantes = limiteMinutos - diffMinutos;

        // Last feed pill
        if (diffMinutos >= 0) {
            const h = Math.floor(diffMinutos / 60);
            const m = diffMinutos % 60;
            lastFeedText.textContent = h > 0
                ? `Última toma hace ${h}h ${m}min`
                : `Última toma hace ${m} min`;
        }

        // Timer display
        if (diffMinutos < 0) {
            tiempoEl.textContent = "-- min";
            minutosRestantes = limiteMinutos;
        } else if (minutosRestantes > 0) {
            tiempoEl.textContent = `${minutosRestantes} min`;
            labelReloj.textContent = "Siguiente toma en";
        } else if (minutosRestantes === 0) {
            tiempoEl.textContent = "¡YA!";
        } else {
            tiempoEl.textContent = `+${Math.abs(minutosRestantes)} min`;
            labelReloj.textContent = "Retraso";
        }

        // Progress
        const pct = Math.min(100, Math.max(0, (diffMinutos / limiteMinutos) * 100));
        document.getElementById('progressBar').style.width = pct + '%';

        // Colors
        timerCard.classList.remove('state-warn', 'state-danger');
        if (diffMinutos >= limiteMinutos) {
            timerCard.classList.add('state-danger');
        } else if (diffMinutos > limiteMinutos * 0.75) {
            timerCard.classList.add('state-warn');
        }

        // Notifications
        if (minutosRestantes === 10 && !notificado10Min) {
            enviarNotificacion("¡Atención! 🍼", "Faltan 10 minutos para la próxima toma.");
            notificado10Min = true;
        } else if (minutosRestantes <= 0 && !notificadoLimite) {
            enviarNotificacion("¡Hora del biberón! 🚨", "Se alcanzó el tiempo límite.");
            notificadoLimite = true;
        }
    }

    /* ── CHART ── */
    document.getElementById('btnAplicarFiltros').addEventListener('click', generarGrafico);

    function generarGrafico() {
        const ctx = document.getElementById('graficoOnzasCurva').getContext('2d');
        let filtradas = tomasProcesadas.slice().reverse();

        if (filterStart.value) {
            const d = new Date(filterStart.value);
            filtradas = filtradas.filter(t => t.fecha >= d);
        }
        if (filterEnd.value) {
            const d = new Date(filterEnd.value);
            d.setHours(23, 59, 59);
            filtradas = filtradas.filter(t => t.fecha <= d);
        }

        if (graficoInstancia) { graficoInstancia.destroy(); graficoInstancia = null; }
        if (!filtradas.length) return;

        let acum = 0;
        const labels = filtradas.map((_, i) => `T${i + 1}`);
        const data   = filtradas.map(t => { acum += t.onzas; return +acum.toFixed(1); });

        graficoInstancia = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    data,
                    borderColor: '#F4A261',
                    backgroundColor: 'rgba(244,162,97,0.12)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#E76F51',
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    borderWidth: 2.5
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { font: { family: 'Nunito', size: 10 }, color: '#9A8878' } },
                    y: { beginAtZero: true, grid: { color: 'rgba(45,34,20,0.05)' }, ticks: { font: { family: 'Nunito', size: 10 }, color: '#9A8878' } }
                }
            }
        });
    }

    /* ── DELETE ── */
    function borrarToma(id, horaStr) {
        if (confirm(`¿Borrar la toma de las ${horaStr}?`)) {
            db.collection("tomas").doc(id).delete()
            .then(() => toast('🗑 Toma eliminada'))
            .catch(err => toast('❌ Error: ' + err.message, 3000));
        }
    }

    /* ── SETTINGS MODAL ── */
    const modal = document.getElementById('settingsModal');
    function abrirSettings() { modal.classList.add('open'); }
    function cerrarSettings() { modal.classList.remove('open'); }

    modal.addEventListener('click', e => { if (e.target === modal) cerrarSettings(); });

    document.getElementById('btnGuardarSettings').addEventListener('click', () => {
        const v = parseInt(document.getElementById('inputLimite').value);
        if (v > 0) {
            db.collection("configuracion").doc("limiteGlobal").set({ minutos: v })
            .then(() => { cerrarSettings(); toast(`✅ Límite guardado: ${v} min`); })
            .catch(err => toast('❌ Error: ' + err.message, 3000));
        }
    });
</script>
</body>
</html>
