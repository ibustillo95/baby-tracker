<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BabyTracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Ajuste para dispositivos móviles modernos */
        body { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-20">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-baby text-yellow-500 mr-2"></i>BabyTracker</h1>
        <button id="btnSettings" class="text-gray-500 text-xl p-2"><i class="fa-solid fa-gear"></i></button>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">
        
        <div id="timerCard" class="bg-green-50 border-2 border-green-200 rounded-2xl p-4 flex justify-between items-center transition-colors duration-500">
            <div>
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Tiempo Transcurrido</p>
                <p class="text-3xl font-black text-gray-800" id="tiempoTranscurrido">-- min</p>
            </div>
            <div class="text-right">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">Límite</p>
                <p class="text-lg font-bold text-gray-700"><span id="limiteDisplay">150</span> min</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Cantidad (Onzas - OZ)</label>
                <div class="flex items-center space-x-4 bg-gray-50 rounded-xl p-2 border border-gray-200">
                    <button type="button" id="btnMinus" class="w-10 h-10 bg-white rounded-lg shadow-sm text-gray-600 font-bold text-xl flex-shrink-0">-</button>
                    <input type="number" id="inputOz" value="4.0" step="0.5" class="w-full min-w-0 bg-transparent text-center text-4xl font-black text-blue-600 focus:outline-none">
                    <button type="button" id="btnPlus" class="w-10 h-10 bg-white rounded-lg shadow-sm text-gray-600 font-bold text-xl flex-shrink-0">+</button>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Hora de la toma</label>
                <input type="datetime-local" id="inputHora" class="w-full bg-gray-50 border border-gray-200 text-gray-700 font-bold rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button id="btnGuardar" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold text-lg rounded-xl py-4 shadow-md transition-all">
                Guardar Toma
            </button>
        </div>

        <div id="settingsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4">Configuración global</h2>
                <label class="block text-sm font-bold text-gray-600 mb-2">Minutos límite para la próxima toma:</label>
                <input type="number" id="inputLimite" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-6 text-xl text-center font-bold">
                <div class="flex space-x-3">
                    <button id="btnCerrarSettings" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl">Cancelar</button>
                    <button id="btnGuardarSettings" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">Guardar</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. REEMPLAZA ESTO CON TUS CREDENCIALES DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Variables de estado
        let limiteMinutos = 150; 
        let ultimaToma = new Date();
        let intervaloReloj;

        // Referencias del DOM
        const inputOz = document.getElementById('inputOz');
        const inputHora = document.getElementById('inputHora');
        const btnGuardar = document.getElementById('btnGuardar');
        const tiempoTranscurrido = document.getElementById('tiempoTranscurrido');
        const timerCard = document.getElementById('timerCard');
        const limiteDisplay = document.getElementById('limiteDisplay');

        // Configurar la hora actual por defecto
        function setHoraActual() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            inputHora.value = now.toISOString().slice(0, 16);
        }
        setHoraActual();

        // Controles de Onzas (+ y -)
        document.getElementById('btnMinus').addEventListener('click', () => {
            let val = parseFloat(inputOz.value);
            if(val > 0.5) inputOz.value = (val - 0.5).toFixed(1);
        });
        document.getElementById('btnPlus').addEventListener('click', () => {
            let val = parseFloat(inputOz.value);
            inputOz.value = (val + 0.5).toFixed(1);
        });

        // FIX: Escuchar la configuración global en Firebase (Consistencia de datos)
        db.collection("configuracion").doc("limiteGlobal").onSnapshot((doc) => {
            if (doc.exists) {
                limiteMinutos = doc.data().minutos;
                limiteDisplay.innerText = limiteMinutos;
                document.getElementById('inputLimite').value = limiteMinutos;
                actualizarColorReloj(); // Forzar actualización visual
            } else {
                // Si no existe, crearlo con el valor por defecto
                db.collection("configuracion").doc("limiteGlobal").set({ minutos: 150 });
            }
        });

        // Escuchar la última toma en tiempo real para el reloj
        db.collection("tomas").orderBy("fecha", "desc").limit(1).onSnapshot((snapshot) => {
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                ultimaToma = doc.data().fecha.toDate();
                iniciarReloj();
            } else {
                tiempoTranscurrido.innerText = "Sin tomas";
            }
        });

        // FIX: Guardar toma con manejo de errores (Evita que el botón se quede pegado)
        btnGuardar.addEventListener('click', () => {
            const btnOriginalText = btnGuardar.innerText;
            btnGuardar.innerText = "Guardando...";
            btnGuardar.disabled = true;
            btnGuardar.classList.add('opacity-75');

            const fechaToma = new Date(inputHora.value);
            const onzas = parseFloat(inputOz.value);

            db.collection("tomas").add({
                fecha: fechaToma,
                onzas: onzas,
                registro: new Date()
            })
            .then(() => {
                // Éxito: Restaurar botón y formulario
                btnGuardar.innerText = "¡Guardado!";
                btnGuardar.classList.remove('bg-blue-600');
                btnGuardar.classList.add('bg-green-500');
                
                setTimeout(() => {
                    btnGuardar.innerText = "Guardar Toma";
                    btnGuardar.classList.remove('bg-green-500');
                    btnGuardar.classList.add('bg-blue-600');
                    btnGuardar.disabled = false;
                    btnGuardar.classList.remove('opacity-75');
                    setHoraActual();
                }, 2000);
            })
            .catch((error) => {
                // Error: Mostrar alerta y restaurar el botón
                console.error("Error al guardar: ", error);
                alert("Hubo un error al guardar. Revisa tu conexión o las reglas de seguridad de Firebase Firestore. Código de error: " + error.message);
                btnGuardar.innerText = "Guardar Toma";
                btnGuardar.disabled = false;
                btnGuardar.classList.remove('opacity-75');
            });
        });

        // Lógica del Reloj y Colores
        function iniciarReloj() {
            if (intervaloReloj) clearInterval(intervaloReloj);
            actualizarReloj();
            intervaloReloj = setInterval(actualizarReloj, 60000); // Cada minuto
        }

        function actualizarReloj() {
            const ahora = new Date();
            const diffMs = ahora - ultimaToma;
            const diffMinutos = Math.floor(diffMs / 60000);
            
            if(diffMinutos < 0) {
                tiempoTranscurrido.innerText = "Toma futura";
                return;
            }

            tiempoTranscurrido.innerText = `${diffMinutos} min`;
            actualizarColorReloj(diffMinutos);
        }

        function actualizarColorReloj(minutos = null) {
            if(minutos === null) {
                const diffMs = new Date() - ultimaToma;
                minutos = Math.floor(diffMs / 60000);
            }

            const porcentaje = minutos / limiteMinutos;
            
            // Limpiar clases
            timerCard.classList.remove('bg-green-50', 'border-green-200', 'bg-orange-50', 'border-orange-200', 'bg-red-50', 'border-red-300', 'animate-pulse');
            
            if (porcentaje < 0.6) {
                timerCard.classList.add('bg-green-50', 'border-green-200'); // Verde
            } else if (porcentaje < 0.9) {
                timerCard.classList.add('bg-orange-50', 'border-orange-200'); // Naranja
            } else {
                timerCard.classList.add('bg-red-50', 'border-red-300', 'animate-pulse'); // Rojo
            }
        }

        // Lógica del Modal de Configuración
        const modal = document.getElementById('settingsModal');
        document.getElementById('btnSettings').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('btnCerrarSettings').addEventListener('click', () => modal.classList.add('hidden'));
        
        document.getElementById('btnGuardarSettings').addEventListener('click', () => {
            const nuevoLimite = parseInt(document.getElementById('inputLimite').value);
            if(nuevoLimite > 0) {
                // Guardar en Firebase para que se sincronice en ambos teléfonos
                db.collection("configuracion").doc("limiteGlobal").set({ minutos: nuevoLimite })
                .then(() => {
                    modal.classList.add('hidden');
                })
                .catch(err => alert("Error al guardar configuración: " + err.message));
            }
        });
    </script>
</body>
</html>
